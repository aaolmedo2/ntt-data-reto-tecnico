openapi: 3.0.3
info:
  title: Customer Service API
  version: 1.0.0

servers:
  - url: http://localhost:8081

tags:
  - name: Customers

paths:

  /api/v1/customers:
    post:
      tags: [Customers]
      summary: Create customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
            example:
              name: Jose Lema
              gender: MALE
              identification: "1234567890"
              address: Otavalo sn y principal
              phone: "098254785"
              password: "1234"
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/customers/{identification}:
    parameters:
      - in: path
        name: identification
        required: true
        schema:
          type: string
          example: "1234567890"

    get:
      tags: [Customers]
      summary: Get customer by identification
      operationId: getCustomerByIdentification
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Customers]
      summary: Update customer (partial) by identification
      operationId: updateCustomerByIdentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatchRequest'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Customers]
      summary: Logical delete customer (sets status = false)
      operationId: deleteCustomerByIdentification
      responses:
        '204':
          description: Customer deactivated
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  schemas:

    CustomerRequest:
      type: object
      required:
        - name
        - gender
        - identification
        - address
        - phone
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Jose Lema
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          example: MALE
        identification:
          type: string
          minLength: 5
          maxLength: 20
          example: "1234567890"
        address:
          type: string
          minLength: 5
          maxLength: 200
          example: Otavalo sn y principal
        phone:
          type: string
          pattern: '^\d{7,15}$'
          example: "098254785"
        password:
          type: string
          minLength: 4
          maxLength: 100
          format: password
          example: "1234"

    CustomerPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Jose Lema Updated
        address:
          type: string
          minLength: 5
          maxLength: 200
          example: Nueva Direccion 123
        phone:
          type: string
          pattern: '^\d{7,15}$'
          example: "098111222"
        password:
          type: string
          minLength: 4
          maxLength: 100
          format: password
          example: "newpass"
        status:
          type: boolean
          example: true

    CustomerResponse:
      type: object
      properties:
        name:
          type: string
          example: Jose Lema
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          example: MALE
        identification:
          type: string
          example: "1234567890"
        address:
          type: string
          example: Otavalo sn y principal
        phone:
          type: string
          example: "098254785"
        status:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2024-02-10T14:30:00Z"
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Customer with identification "1234567890" not found
        path:
          type: string
          example: /api/v1/customers/1234567890

  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2024-02-10T14:30:00"
            status: 400
            error: Bad Request
            message: "Field 'name' must not be blank"
            path: /api/v1/customers

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2024-02-10T14:30:00"
            status: 404
            error: Not Found
            message: Customer with identification "1234567890" not found
            path: /api/v1/customers/1234567890

    Conflict:
      description: Identification already registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2024-02-10T14:30:00"
            status: 409
            error: Conflict
            message: "Identification '1234567890' is already registered"
            path: /api/v1/customers

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2024-02-10T14:30:00"
            status: 500
            error: Internal Server Error
            message: An unexpected error occurred
            path: /api/v1/customers