spring:
    application:
        name: customer-service
    datasource:
        url: jdbc:postgresql://localhost:5432/customer_service
        username: postgres
        password: root
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                '[format_sql]': true
                dialect: org.hibernate.dialect.PostgreSQLDialect
server:
    port: 8081
logging:
    level:
        root: INFO
        '[com.data.ntt.customer_service]': DEBUG

