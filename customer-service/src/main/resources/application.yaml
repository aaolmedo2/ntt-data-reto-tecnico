server:
    port: 8081
spring:
    profiles:
        active: local-dev

---
spring:
    config:
        activate:
            on-profile: local-dev
    application:
        name: customer-service
    datasource:
        url: jdbc:postgresql://localhost:5432/customer_service
        username: postgres
        password: root
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                '[format_sql]': true
                dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
    level:
        root: INFO
        '[com.data.ntt.customer_service]': DEBUG

---
spring:
    config:
        activate:
            on-profile: docker-dev
    application:
        name: customer-service
    datasource:
        url: jdbc:postgresql://host.docker.internal:5432/customer_service
        username: postgres
        password: root
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                '[format_sql]': true
                dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
    level:
        root: INFO
        '[com.data.ntt.customer_service]': DEBUG

---
spring:
    config:
        activate:
            on-profile: test
    application:
        name: customer-service
    datasource:
        url: jdbc:postgresql://localhost:5432/customer_service_test
        username: postgres
        password: root
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
server:
    port: 0
logging:
    level:
        root: INFO
        '[com.data.ntt.customer_service]': DEBUG

---
spring:
    config:
        activate:
            on-profile: prod
    application:
        name: customer-service
    datasource:
        url: jdbc:postgresql://postgres:5432/customer_service
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                '[format_sql]': true
                dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
    level:
        root: INFO
        '[com.data.ntt.customer_service]': DEBUG

