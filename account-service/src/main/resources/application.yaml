spring:
  application:
    name: account-service

    datasource:
        url: jdbc:postgresql://localhost:5432/account_service
        username: postgres
        password: root
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                '[format_sql]': true
                dialect: org.hibernate.dialect.PostgreSQLDialect
server:
    port: 8081
logging:
    level:
        root: INFO
        '[com.data.ntt.account_service]': DEBUG

