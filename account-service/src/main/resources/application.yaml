server:
    port: 8082
spring:
  profiles:
    active: local-dev

---
spring:
  config:
      activate:
          on-profile: local-dev
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://localhost:5432/account_service
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
    level:
        root: INFO
        '[com.data.ntt.account_service]': DEBUG

customer-service:
    base-url: http://localhost:8081

