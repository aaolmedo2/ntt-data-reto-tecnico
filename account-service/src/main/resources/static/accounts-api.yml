openapi: 3.0.3
info:
  title: Account Service API
  version: 1.0.0

servers:
  - url: http://localhost:8082

tags:
  - name: Accounts
  - name: Movements
  - name: Reports

paths:

  # ─── ACCOUNTS ──────────────────────────────────────────────────────────────

  /api/v1/accounts:
    post:
      tags: [Accounts]
      summary: Create account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
            example:
              accountType: SAVINGS
              initialBalance: 2000.00
              customerIdentification: "123456789"
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Customer not found in customer-service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2024-02-10T14:30:00"
                status: 404
                error: Not Found
                message: Customer with id 99 not found
                path: /api/v1/accounts
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/accounts/{accountNumber}:
    parameters:
      - in: path
        name: accountNumber
        required: true
        schema:
          type: string
          example: "478758"

    get:
      tags: [Accounts]
      summary: Get account by account number
      operationId: getAccountByAccountNumber
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Accounts]
      summary: Update account (partial) by account number
      operationId: updateAccountByAccountNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Accounts]
      summary: Logical delete account (sets status = false)
      operationId: deleteAccountByAccountNumber
      responses:
        '204':
          description: Account deactivated
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── MOVEMENTS ─────────────────────────────────────────────────────────────

  /api/v1/movements:
    get:
      tags: [Movements]
      summary: Get movements by filters
      operationId: getMovements
      description: |
        Requires at least startDate and endDate. accountId is optional to filter by a specific account.
        startDate must not be after endDate.
      parameters:
        - in: query
          name: accountNumber
          required: false
          description: Optional filter by account
          schema:
            type: string
            example: "478758"
        - in: query
          name: startDate
          required: true
          description: Start date inclusive — format yyyy-MM-dd
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - in: query
          name: endDate
          required: true
          description: End date inclusive — format yyyy-MM-dd
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        '200':
          description: Movements found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Movements]
      summary: Register movement
      operationId: createMovement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
            examples:
              debit:
                summary: Withdrawal
                value:
                  accountNumber: "478758"
                  type: DEBIT
                  amount: 575.00
              credit:
                summary: Deposit
                value:
                  accountNumber: "478758"
                  type: CREDIT
                  amount: 600.00
      responses:
        '201':
          description: Movement registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementResponse'
        '400':
          description: Validation error or insufficient balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientBalance:
                  summary: Insufficient balance (F3)
                  value:
                    timestamp: "2024-02-10T14:30:00"
                    status: 400
                    error: Bad Request
                    message: "Saldo no disponible"
                    path: /api/v1/movements
                invalidAmount:
                  summary: Amount not greater than zero
                  value:
                    timestamp: "2024-02-10T14:30:00"
                    status: 400
                    error: Bad Request
                    message: "Movement amount must be greater than zero"
                    path: /api/v1/movements
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── REPORTS ───────────────────────────────────────────────────────────────

  /reports/{identification}:
    get:
      tags: [Reports]
      summary: Get account statement report by customer identification
      operationId: getAccountStatementByCustomerIdentification
      parameters:
        - in: path
          name: identification
          required: true
          schema:
            type: string
            example: "123456789"
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
            example: "2024-02-01"
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
            example: "2024-02-28"
      responses:
        '200':
          description: Report generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatementResponse'
              example:
                customerName: Marianela Montalvo
                startDate: "2024-02-01"
                endDate: "2024-02-28"
                accounts:
                  - accountNumber: "225487"
                    accountType: CHECKING
                    initialBalance: 100.00
                    availableBalance: 700.00
                    status: true
                    movements:
                        date: "2024-02-10T10:00:00"
                        movementType: CREDIT
                        amount: 600.00
                        balanceAfterMovement: 700.00
                  - accountNumber: "496825"
                    accountType: SAVINGS
                    initialBalance: 540.00
                    availableBalance: 0.00
                    status: true
                    movements:
                        date: "2024-02-08T10:00:00"
                        movementType: DEBIT
                        amount: 540.00
                        balanceAfterMovement: 0.00
        '400':
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2024-02-10T14:30:00"
                status: 400
                error: Bad Request
                message: "startDate must not be after endDate"
                path: /reports/123456789
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  schemas:

    # ── ACCOUNT ───────────────────────────────────────────────────────────────

    AccountRequest:
      type: object
      required:
        - accountNumber
        - accountType
        - initialBalance
        - customerIdentification
      properties:
        accountNumber:
          type: string
          description: Client-provided account number
          example: "1234567890"
        accountType:
          type: string
          enum: [SAVINGS, CHECKING]
          example: SAVINGS
        initialBalance:
          type: number
          format: double
          minimum: 0
          description: Sets availableBalance on creation — cannot be modified later
          example: 2000.00
        customerIdentification:
          type: string
          description: Unique identifier for the customer
          example: "123456789"

    AccountPatchRequest:
      type: object
      properties:
        accountType:
          type: string
          enum: [SAVINGS, CHECKING]
          example: CHECKING
        status:
          type: boolean
          example: false

    AccountResponse:
      type: object
      properties:
        accountNumber:
          type: string
          example: "478758"
        accountType:
          type: string
          enum: [SAVINGS, CHECKING]
          example: SAVINGS
        initialBalance:
          type: number
          format: double
          example: 2000.00
        availableBalance:
          type: number
          format: double
          description: Current balance after all movements
          example: 1425.00
        status:
          type: boolean
          example: true
        customer:
          $ref: '#/components/schemas/CustomerSummary'

    CustomerSummary:
      type: object
      properties:
        name:
          type: string
          example: "SOFIA DELGADO"
        gender:
          type: string
          example: "MALE"
        identification:
          type: string
          example: "1719027011"
        address:
          type: string
          example: "SAN ISIDRO DEL INCA"
        phone:
          type: string
          example: "0984604606"
        status:
          type: boolean
          example: false

    # ── MOVEMENT ──────────────────────────────────────────────────────────────

    MovementRequest:
      type: object
      required:
        - accountNumber
        - type
        - amount
      properties:
        accountNumber:
          type: string
          example: "478758"
        type:
          type: string
          enum: [DEBIT, CREDIT]
          example: DEBIT
        amount:
          type: number
          format: double
          minimum: 0.01
          description: Must be greater than zero
          example: 575.00

    MovementResponse:
      type: object
      properties:
        date:
          type: string
          format: date-time
          example: "2024-02-10T10:00:00Z"
        type:
          type: string
          enum: [DEBIT, CREDIT]
          example: DEBIT
        amount:
          type: number
          format: double
          example: 575.00
        balanceAfterMovement:
          type: number
          format: double
          description: Snapshot of balance immediately after this movement
          example: 1425.00
        account:
          $ref: '#/components/schemas/AccountResponse'

    # ── REPORT ────────────────────────────────────────────────────────────────

    AccountStatementResponse:
      type: object
      properties:
        customerIdentification:
          type: string
          example: "123456789"
        customerName:
          type: string
          description: Fetched from customer-service at report generation time
          example: Marianela Montalvo
        startDate:
          type: string
          format: date
          example: "2024-02-01"
        endDate:
          type: string
          format: date
          example: "2024-02-28"
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountStatementDetail'

    AccountStatementDetail:
      type: object
      properties:
        accountNumber:
          type: string
          example: "225487"
        accountType:
          type: string
          enum: [SAVINGS, CHECKING]
          example: CHECKING
        initialBalance:
          type: number
          format: double
          example: 100.00
        availableBalance:
          type: number
          format: double
          example: 700.00
        status:
          type: boolean
          example: true
        movements:
          type: array
          description: Movements within the requested date range
          items:
            $ref: '#/components/schemas/MovementResponse'

    # ── ERROR ─────────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2024-02-10T14:30:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: "Saldo no disponible"
        path:
          type: string
          example: /api/v1/movements

  responses:
    BadRequest:
      description: Invalid request payload or constraint violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2024-02-10T14:30:00"
            status: 400
            error: Bad Request
            message: "Field 'amount' must be greater than 0"
            path: /api/v1/movements

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2024-02-10T14:30:00"
            status: 404
            error: Not Found
            message: Account with id 99 not found
            path: /api/v1/accounts/99

    Conflict:
      description: Account number already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2024-02-10T14:30:00"
            status: 409
            error: Conflict
            message: "Account number '478758' already exists"
            path: /api/v1/accounts

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2024-02-10T14:30:00"
            status: 500
            error: Internal Server Error
            message: An unexpected error occurred
            path: /api/v1/accounts