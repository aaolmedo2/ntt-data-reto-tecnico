spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/account_service
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  main:
    web-application-type: reactive
server:
  port: 0
logging:
  level:
    root: WARN
